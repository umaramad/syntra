<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Compare</title>
  <link rel="icon" href="/static/images/syntra-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/git_compare.css">
</head>
<body class="gc-app-body">
  <header class="gc-header">
    <div class="gc-header-left">
      <img src="/static/images/syntra-mark.svg" alt="" width="28" height="28">
      <div>
        <h1>Git Compare</h1>
        <p id="session-label">Loading session...</p>
      </div>
    </div>
    <div class="gc-header-actions">
      <a href="/" class="gc-btn gc-btn-ghost">Syntra home</a>
      <button type="button" class="gc-btn gc-btn-ghost" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="gc-layout">
    <section class="gc-panel">
      <h2>Repositories</h2>
      <form id="repo-form" class="gc-form gc-form-grid">
        <label>
          <span>From repository</span>
          <input type="text" id="from-repo" placeholder="owner/repo or full URL" required>
        </label>
        <label>
          <span>To repository</span>
          <input type="text" id="to-repo" placeholder="owner/repo or full URL" required>
        </label>
        <button type="button" class="gc-btn gc-btn-secondary" id="load-refs-btn">Load branches &amp; tags</button>
      </form>
      <p class="gc-error" id="refs-error" hidden></p>

      <div class="gc-ref-grid" id="ref-selectors" hidden>
        <div>
          <h3>From ref</h3>
          <div class="gc-ref-type">
            <label><input type="radio" name="from-ref-type" value="branch" checked> Branch</label>
            <label><input type="radio" name="from-ref-type" value="tag"> Tag</label>
          </div>
          <select id="from-ref" class="gc-select"></select>
        </div>
        <div>
          <h3>To ref</h3>
          <div class="gc-ref-type">
            <label><input type="radio" name="to-ref-type" value="branch" checked> Branch</label>
            <label><input type="radio" name="to-ref-type" value="tag"> Tag</label>
          </div>
          <select id="to-ref" class="gc-select"></select>
        </div>
      </div>

      <div class="gc-actions">
        <button type="button" class="gc-btn gc-btn-primary" id="compare-btn" disabled>Compare</button>
      </div>
      <p class="gc-error" id="compare-error" hidden></p>
    </section>

    <section class="gc-panel">
      <div class="gc-panel-head">
        <h2>History</h2>
        <button type="button" class="gc-btn gc-btn-ghost" id="refresh-history-btn">Refresh</button>
      </div>
      <div id="history-list" class="gc-history-list">
        <p class="gc-muted">No comparisons yet.</p>
      </div>
    </section>

    <section class="gc-panel gc-panel-wide" id="results-panel" hidden>
      <div class="gc-panel-head">
        <h2>Comparison results</h2>
        <div class="gc-inline-actions">
          <button type="button" class="gc-btn gc-btn-secondary" id="download-html-btn" disabled>Download HTML</button>
          <a class="gc-btn gc-btn-ghost" id="open-view-link" href="#" hidden>Open full view</a>
        </div>
      </div>
      <div id="compare-stats" class="gc-stats"></div>
      <div id="file-list" class="gc-file-list"></div>
      <div id="diff-viewer" class="gc-diff-viewer" hidden>
        <div class="gc-diff-viewer-head">
          <h3 id="diff-file-title"></h3>
          <button type="button" class="gc-btn gc-btn-ghost" id="close-diff-btn">Close</button>
        </div>
        <div class="gc-diff-grid">
          <div class="gc-diff-pane">
            <div class="gc-diff-pane-title">From</div>
            <pre id="diff-left"></pre>
          </div>
          <div class="gc-diff-pane">
            <div class="gc-diff-pane-title">To</div>
            <pre id="diff-right"></pre>
          </div>
        </div>
        <details class="gc-unified-diff">
          <summary>Unified diff</summary>
          <pre id="diff-unified"></pre>
        </details>
      </div>
    </section>
  </main>

  <script src="/static/js/git_compare/app.js"></script>
</body>
</html>

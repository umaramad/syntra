<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Compare — Login</title>
  <link rel="icon" href="/static/images/syntra-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/git_compare.css">
</head>
<body class="gc-auth-body">
  <main class="gc-auth-card">
    <a class="gc-back-link" href="/">← Back to Syntra</a>
    <img src="/static/images/syntra-mark.svg" alt="" width="40" height="40" class="gc-logo">
    <h1>Git Compare</h1>
    <p class="gc-subtitle">Compare branches and tags across repositories in your browser. No local clone required.</p>

    <form id="login-form" class="gc-form">
      <label>
        <span>User ID</span>
        <input type="text" id="user-id" placeholder="your.username" required autocomplete="username">
      </label>
      <label>
        <span>Provider</span>
        <select id="provider">
          {% for provider in providers %}
          <option value="{{ provider.id }}">{{ provider.label }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Sign in with</span>
        <select id="auth-type">
          <option value="pat">Personal access token (PAT)</option>
          <option value="password">Username &amp; password</option>
        </select>
      </label>
      <label id="pat-field">
        <span>Personal access token</span>
        <input type="password" id="api-token" placeholder="Paste your PAT" autocomplete="off">
      </label>
      <label id="password-field" hidden>
        <span>Password</span>
        <input type="password" id="api-password" placeholder="Account password or app password" autocomplete="current-password">
      </label>
      <p class="gc-hint" id="auth-hint">Use a PAT with repo read access. For Bitbucket, an app password also works under Username &amp; password.</p>
      <button type="submit" class="gc-btn gc-btn-primary" id="login-btn">Sign in</button>
      <p class="gc-error" id="login-error" hidden></p>
    </form>
  </main>
  <script src="/static/js/git_compare/login.js"></script>
</body>
</html>

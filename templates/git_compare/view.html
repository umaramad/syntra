<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Compare — View</title>
  <link rel="icon" href="/static/images/syntra-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/git_compare.css">
</head>
<body class="gc-app-body">
  <header class="gc-header">
    <div class="gc-header-left">
      <img src="/static/images/syntra-mark.svg" alt="" width="28" height="28">
      <div>
        <h1>Comparison view</h1>
        <p id="view-meta">Loading...</p>
      </div>
    </div>
    <div class="gc-header-actions">
      <a href="/git-compare/app" class="gc-btn gc-btn-ghost">← Back</a>
      <button type="button" class="gc-btn gc-btn-secondary" id="download-btn">Download HTML</button>
    </div>
  </header>

  <main class="gc-layout gc-layout-single">
    <section class="gc-panel gc-panel-wide">
      <div id="view-stats" class="gc-stats"></div>
      <div id="view-file-list" class="gc-file-list"></div>
      <div id="view-diff" class="gc-diff-viewer" hidden>
        <div class="gc-diff-viewer-head">
          <h3 id="view-diff-title"></h3>
          <button type="button" class="gc-btn gc-btn-ghost" id="view-close-diff">Close</button>
        </div>
        <div class="gc-diff-grid">
          <div class="gc-diff-pane">
            <div class="gc-diff-pane-title">From</div>
            <pre id="view-diff-left"></pre>
          </div>
          <div class="gc-diff-pane">
            <div class="gc-diff-pane-title">To</div>
            <pre id="view-diff-right"></pre>
          </div>
        </div>
        <details class="gc-unified-diff">
          <summary>Unified diff</summary>
          <pre id="view-diff-unified"></pre>
        </details>
      </div>
    </section>
  </main>

  <script>
    window.GIT_COMPARE_ENTRY_ID = {{ entry_id }};
  </script>
  <script src="/static/js/git_compare/view.js"></script>
</body>
</html>
